# Статика фронта ScribeowlAI. Порт 3000 — как у прежнего stage-контейнера (маршрут Traefik не меняется).
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # точка входа — без кэша, чтобы новый деплой подхватывался сразу
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # файлы с хэшем в имени — навсегда
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: неизвестные пути → index.html
  location / {
    try_files $uri /index.html;
  }
}
